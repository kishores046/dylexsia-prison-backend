spring:
  application:
    name: dyslexia-backend-core
  profiles:
    active: dev


---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL_DEV}
    driver-class-name: org.h2.Driver
    username: ${DB_USER_DEV}
    password: ${DB_PASSWORD_DEV}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update


jwt:
  secret: ${JWT_SECRET}
  expiration: ${EXPIRATION}
  issuer: ${ISSUER}
  audience : ${AUDIENCE}
  refresh-expiration: ${REFRESH_EXPIRATION}


